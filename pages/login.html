<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Skillora</title>
    <link rel="icon" type="image/png" href="../img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/tailwind-config.js"></script>
    <script src="https://unpkg.com/lucide@0.477.0"></script>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .auth-bg {
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .auth-content-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.08);
        }

        .social-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .social-btn:hover {
            background-color: #f1f5f9;
            border-color: #2C7BE5;
            transform: translateY(-2px);
        }

        .input-focus:focus {
            border-color: #2C7BE5;
            box-shadow: 0 0 0 4px rgba(44, 123, 229, 0.1);
        }
    </style>
</head>

<body class="auth-bg auth-page">

    <!-- Auth Header -->
    <header class="auth-header">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <!-- Left: Brand -->
            <a href="../index.html" class="flex items-center gap-3 no-underline group shrink-0">
                <div
                    class="w-10 h-10 bg-primary-blue rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-500/20 group-hover:scale-110 transition duration-300">
                    <i data-lucide="graduation-cap" class="w-6 h-6"></i>
                </div>
                <span class="text-2xl font-black text-slate-900 tracking-tight">Skillora</span>
            </a>

            <!-- Right: Back Link -->
            <a href="../index.html" class="back-link">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span>Back to Home</span>
            </a>
        </div>
    </header>

    <!-- Content Wrapper -->
    <div class="auth-content-wrapper p-10 mt-10">
        <!-- Main Content -->
        <main class="w-full max-w-[480px] relative z-10" data-animate="fade-up">

            <!-- Auth Card -->
            <div class="auth-card w-full p-6 sm:p-10 rounded-3xl" data-animate="fade-up">

                <!-- Welcome Message -->
                <div class="text-center mb-6">
                    <div class="inline-flex mb-4 p-3 bg-blue-50 text-primary-blue rounded-2xl">
                        <i data-lucide="user-circle" class="w-6 h-6"></i>
                    </div>
                    <h1 class="text-2xl font-black text-slate-900 mb-2">Welcome Back</h1>
                    <p class="text-slate-500 font-medium text-sm">Please enter your details to sign in.</p>
                </div>

                <!-- Social Logins -->
                <div class="grid grid-cols-2 gap-3 mb-6">
                    <button
                        class="social-btn flex items-center justify-center gap-2 py-3 border border-slate-200 rounded-xl font-bold text-slate-700 bg-white text-xs sm:text-sm">
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-4 h-4" alt="Google">
                        <span>Google</span>
                    </button>
                    <button
                        class="social-btn flex items-center justify-center gap-2 py-3 border border-slate-200 rounded-xl font-bold text-slate-700 bg-white text-xs sm:text-sm">
                        <i data-lucide="github" class="w-4 h-4 text-slate-900"></i>
                        <span>GitHub</span>
                    </button>
                </div>

                <!-- Divider -->
                <div class="relative flex items-center mb-6">
                    <div class="flex-grow border-t border-slate-200"></div>
                    <span
                        class="px-3 text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] whitespace-nowrap">OR</span>
                    <div class="flex-grow border-t border-slate-200"></div>
                </div>

                <!-- Login Form -->
                <form id="login-form" class="space-y-4">
                    <div>
                        <label
                            class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1">Email</label>
                        <div class="relative">
                            <i data-lucide="mail"
                                class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                            <input type="email" id="email" required placeholder="Email Address"
                                class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none transition input-focus text-slate-900 font-medium text-sm">
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-1.5 ml-1">
                            <label
                                class="block text-xs font-bold text-slate-400 uppercase tracking-widest">Password</label>
                            <a href="#" class="text-[10px] font-bold text-primary-blue hover:underline">Forgot?</a>
                        </div>
                        <div class="relative">
                            <i data-lucide="lock"
                                class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                            <input type="password" id="password" required placeholder="Password"
                                class="w-full pl-10 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none transition input-focus text-slate-900 font-medium text-sm">
                            <button type="button" id="togglePassword"
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition">
                                <i data-lucide="eye" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 px-1">
                        <input type="checkbox" id="remember"
                            class="w-4 h-4 rounded border-slate-300 text-primary-blue focus:ring-primary-blue">
                        <label for="remember" class="text-xs font-bold text-slate-500">Remember me</label>
                    </div>

                    <div id="error-message" class="text-red-500 text-xs font-bold px-1 hidden">
                        Invalid login credentials. Please try again.
                    </div>

                    <button type="submit"
                        class="w-full btn-skillora py-3.5 !rounded-xl uppercase tracking-widest text-xs font-bold shadow-lg shadow-blue-500/20 hover:shadow-blue-500/30 mt-2">
                        Sign In
                    </button>
                </form>

                <!-- Toggle Info -->
                <div class="mt-6 pt-6 border-t border-slate-100 text-center">
                    <p class="text-slate-500 font-medium text-xs">
                        Don't have an account?
                        <a href="signup.html" class="text-primary-blue font-bold ml-1 hover:underline">Sign Up Free</a>
                    </p>
                </div>
            </div>

            <!-- Security Microcopy -->
            <div class="mt-8 flex justify-center items-center gap-2 text-slate-400 text-[10px] font-medium">
                <i data-lucide="shield-check" class="w-3 h-3 text-green-500"></i>
                <span>256-bit secure encryption</span>
            </div>
        </main>
    </div>

    <!-- Background Elements -->
    <div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-10 overflow-hidden">
        <div
            class="absolute top-[-5rem] sm:top-[-10rem] right-[-5rem] sm:right-[-10rem] w-[30rem] sm:w-[40rem] h-[30rem] sm:h-[40rem] bg-primary-blue/5 rounded-full blur-[80px] sm:blur-[100px]">
        </div>
        <div
            class="absolute bottom-[-5rem] sm:bottom-[-10rem] left-[-5rem] sm:left-[-10rem] w-[30rem] sm:w-[40rem] h-[30rem] sm:h-[40rem] bg-indigo-500/5 rounded-full blur-[80px] sm:blur-[100px]">
        </div>
    </div>


    <script src="../js/script.js"></script>
    <script>
        lucide.createIcons();

        // Password visibility toggle
        const togglePasswordBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        if (togglePasswordBtn) {
            togglePasswordBtn.addEventListener('click', (e) => {
                e.preventDefault();
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                const icon = togglePasswordBtn.querySelector('i');
                icon.setAttribute('data-lucide', isPassword ? 'eye-off' : 'eye');
                lucide.createIcons();
            });
        }

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-message');

            if (email === 'admin@gmail.com' && password === 'admin123') {
                // Store user info in localStorage for admin
                localStorage.setItem('userEmail', email);
                localStorage.setItem('userRole', 'admin');
                localStorage.setItem('loginTime', new Date().getTime());
                window.location.href = 'admin-dashboard.html';
            } else {
                // For regular user login, store user info and redirect
                localStorage.setItem('userEmail', email);
                localStorage.setItem('userRole', 'user');
                localStorage.setItem('loginTime', new Date().getTime());
                window.location.href = 'user-dashboard.html';
            }
        });
    </script>
</body>

</html>
